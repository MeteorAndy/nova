name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  check-title:
    name: Check PR title
    runs-on: ubuntu-latest

    steps:
      - name: Require a readable PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "${PR_TITLE}" ]; then
            echo "PR title must not be empty."
            echo "PR 标题不能为空。"
            echo "Current title: ${PR_TITLE}"
            exit 1
          fi

          if ! printf '%s' "${PR_TITLE}" | grep -Pq '[\p{L}]'; then
            echo "PR title must include at least one letter (any script)."
            echo "PR 标题至少需要包含一个字母（任意文字）。"
            echo "Current title: ${PR_TITLE}"
            exit 1
          fi
